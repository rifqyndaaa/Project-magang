<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKopi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261A14" />
      <stop offset="50%" stop-color="#3B281E" />
      <stop offset="100%" stop-color="#19100C" />
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#211915" />
      <stop offset="30%" stop-color="#382C24" />
      <stop offset="70%" stop-color="#2D221C" />
      <stop offset="100%" stop-color="#1A130F" />
    </linearGradient>
    <linearGradient id="labelKraft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAD9BA" />
      <stop offset="100%" stop-color="#D1BD9B" />
    </linearGradient>
    <linearGradient id="beanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F4627" />
      <stop offset="100%" stop-color="#2C1608" />
    </linearGradient>
    <linearGradient id="goldKopi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="pouchShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#bgKopi)" />

  <!-- Wooden Table Surface Base -->
  <path d="M0 450 L800 450 L800 600 L0 600 Z" fill="#1C130E" />
  <line x1="0" y1="450" x2="800" y2="450" stroke="#4A3427" stroke-width="3" />

  <!-- Coffee Beans Scattered on Surface -->
  <g transform="translate(400, 480)">
    <!-- Bean 1 -->
    <g transform="translate(-160, 20) rotate(-25)">
      <ellipse rx="22" ry="14" fill="url(#beanGrad)" stroke="#1F1106" stroke-width="1.5" />
      <path d="M-18 0 Q0 -6 18 0 Q0 6 -18 0" fill="#150B03" />
    </g>
    <!-- Bean 2 -->
    <g transform="translate(-110, 40) rotate(40)">
      <ellipse rx="24" ry="15" fill="url(#beanGrad)" stroke="#1F1106" stroke-width="1.5" />
      <path d="M-20 0 Q0 -6 20 0 Q0 6 -20 0" fill="#150B03" />
    </g>
    <!-- Bean 3 -->
    <g transform="translate(130, 30) rotate(-15)">
      <ellipse rx="25" ry="16" fill="url(#beanGrad)" stroke="#1F1106" stroke-width="1.5" />
      <path d="M-21 0 Q0 -7 21 0 Q0 7 -21 0" fill="#150B03" />
    </g>
    <!-- Bean 4 -->
    <g transform="translate(180, 45) rotate(65)">
      <ellipse rx="20" ry="13" fill="url(#beanGrad)" stroke="#1F1106" stroke-width="1.5" />
      <path d="M-16 0 Q0 -5 16 0 Q0 5 -16 0" fill="#150B03" />
    </g>
  </g>

  <!-- Coffee Pouch Package (Center) -->
  <g transform="translate(400, 260)" filter="url(#pouchShadow)">
    <!-- Main Pouch Silhouette -->
    <path d="M-120 -180 L120 -180 L140 180 L-140 180 Z" fill="url(#pouchGrad)" stroke="#110B07" stroke-width="2" />
    
    <!-- Pouch Top Seal & Zipper Notch -->
    <rect x="-120" y="-180" width="240" height="25" fill="#18120E" stroke="#2B2019" stroke-width="1" />
    <line x1="-120" y1="-170" x2="120" y2="-170" stroke="#3D2E24" stroke-width="2" stroke-dasharray="3 3" />
    <path d="M-120 -162 L-114 -162" stroke="#523F32" stroke-width="3" />
    <path d="M120 -162 L114 -162" stroke="#523F32" stroke-width="3" />

    <!-- Valve Circle -->
    <circle cx="0" cy="-125" r="9" fill="#18120E" stroke="#3D2E24" stroke-width="1.5" />
    <circle cx="0" cy="-125" r="3" fill="#0D0907" />

    <!-- Craft Paper Label -->
    <rect x="-95" y="-95" width="190" height="235" rx="4" fill="url(#labelKraft)" stroke="#8C7355" stroke-width="1.5" />
    
    <!-- Label Inner Border -->
    <rect x="-87" y="-87" width="174" height="219" rx="2" fill="none" stroke="#A89270" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Label Content -->
    <text x="0" y="-62" fill="#8C5C15" font-family="Arial, sans-serif" font-weight="700" font-size="9" text-anchor="middle" letter-spacing="2">PRODUK UNGGULAN RIAU</text>
    <line x1="-50" y1="-54" x2="50" y2="-54" stroke="#8C5C15" stroke-width="1" />
    
    <text x="0" y="-30" fill="#1F130B" font-family="'Georgia', serif" font-weight="900" font-size="18" text-anchor="middle">KOPI LIBERIKA</text>
    <text x="0" y="-12" fill="#5B3919" font-family="Arial, sans-serif" font-weight="800" font-size="11" text-anchor="middle" letter-spacing="1">RANGSANG MERANTI</text>
    
    <!-- Emblem / Coffee Branch -->
    <g transform="translate(0, 35)">
      <circle r="30" fill="#2E1C10" />
      <circle r="26" fill="none" stroke="url(#goldKopi)" stroke-width="1" />
      <!-- Giant Liberica Bean in Logo -->
      <ellipse rx="14" ry="9" fill="url(#goldKopi)" />
      <path d="M-11 0 Q0 -4 11 0 Q0 4 -11 0" fill="#2E1C10" />
    </g>

    <text x="0" y="90" fill="#3D2B1B" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" font-weight="600">Lahan Gambut Pesisir Riau</text>
    <text x="0" y="104" fill="#6B4F37" font-family="Arial, sans-serif" font-size="7.5" text-anchor="middle">Aroma Nangka Alami &bull; Rendah Kafein</text>

    <!-- Netto Badge -->
    <rect x="-35" y="115" width="70" height="16" rx="3" fill="#2E1C10" />
    <text x="0" y="126" fill="#F8FAFC" font-family="Arial, sans-serif" font-weight="700" font-size="8" text-anchor="middle">NETTO 250G</text>
  </g>

  <!-- Text Label Overlay -->
  <rect x="180" y="535" width="440" height="42" rx="6" fill="#110B07" stroke="url(#goldKopi)" stroke-width="1" />
  <text x="400" y="561" fill="#FDE68A" font-family="Arial, sans-serif" font-weight="700" font-size="15" text-anchor="middle" letter-spacing="2">KOPI LIBERIKA RIAU (KAB. KEP. MERANTI)</text>
</svg>
