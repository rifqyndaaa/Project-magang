<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCandi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2430" />
      <stop offset="50%" stop-color="#2D3A4B" />
      <stop offset="100%" stop-color="#111822" />
    </linearGradient>
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9C442A" />
      <stop offset="40%" stop-color="#C0583A" />
      <stop offset="80%" stop-color="#9C442A" />
      <stop offset="100%" stop-color="#7A301A" />
    </linearGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <filter id="candiShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#bgCandi)" />

  <!-- Pedestal Stand (Dark Mahony Wood) -->
  <g transform="translate(400, 440)">
    <polygon points="-240,40 240,40 210,0 -210,0" fill="#1C140E" />
    <rect x="-210" y="-30" width="420" height="30" rx="3" fill="#3B2618" stroke="url(#goldPlate)" stroke-width="1.5" />
    <rect x="-150" y="-18" width="300" height="18" rx="2" fill="#170F0A" />
    <text x="0" y="-5" fill="url(#goldPlate)" font-family="Arial, sans-serif" font-weight="700" font-size="9" text-anchor="middle" letter-spacing="2">CANDI MUARA TAKUS &bull; KAB. KAMPAR</text>
  </g>

  <!-- Miniature Candi Mahligai Muara Takus Structure -->
  <g transform="translate(400, 210)" filter="url(#candiShadow)">
    <!-- Base Terraces (Red Brick Ancient Terraces) -->
    <rect x="-140" y="150" width="280" height="30" fill="url(#brickGrad)" stroke="#5E2010" stroke-width="1.5" />
    <rect x="-115" y="125" width="230" height="25" fill="url(#brickGrad)" stroke="#5E2010" stroke-width="1.5" />
    <rect x="-90" y="100" width="180" height="25" fill="url(#brickGrad)" stroke="#5E2010" stroke-width="1.5" />

    <!-- Stupa Octagonal Base (Lotus Throne / Padmasana) -->
    <polygon points="-75,100 -55,60 55,60 75,100" fill="url(#brickGrad)" stroke="#5E2010" stroke-width="1.5" />
    <ellipse cx="0" cy="60" rx="55" ry="12" fill="#D97252" stroke="#5E2010" stroke-width="1.5" />

    <!-- Main Cylindrical Spire (Candi Mahligai Tower Body) -->
    <path d="M-45 60 L-35 -50 L35 -50 L45 60 Z" fill="url(#brickGrad)" stroke="#5E2010" stroke-width="1.5" />
    
    <!-- Decorative Rings around Tower -->
    <line x1="-42" y1="35" x2="42" y2="35" stroke="#FDE047" stroke-width="2" opacity="0.6" />
    <line x1="-39" y1="5" x2="39" y2="5" stroke="#FDE047" stroke-width="2" opacity="0.6" />
    <line x1="-37" y1="-25" x2="37" y2="-25" stroke="#FDE047" stroke-width="2" opacity="0.6" />

    <!-- Upper Lotus Ring -->
    <ellipse cx="0" cy="-50" rx="36" ry="9" fill="#D97252" stroke="#5E2010" stroke-width="1.5" />

    <!-- Conical Pinnacle & Golden Umbrella Crown (Chattra) -->
    <path d="M-22 -50 L-10 -110 L10 -110 L22 -50 Z" fill="url(#brickGrad)" stroke="#5E2010" stroke-width="1.5" />
    <ellipse cx="0" cy="-110" rx="14" ry="4" fill="url(#goldPlate)" />
    
    <!-- Top Spire Finial -->
    <path d="M-6 -110 L0 -145 L6 -110 Z" fill="url(#goldPlate)" />
    <circle cx="0" cy="-148" r="4" fill="url(#goldPlate)" />
  </g>

  <!-- Text Label Overlay -->
  <rect x="180" y="525" width="440" height="42" rx="6" fill="#111822" stroke="url(#goldPlate)" stroke-width="1" />
  <text x="400" y="551" fill="#FEF08A" font-family="Arial, sans-serif" font-weight="700" font-size="15" text-anchor="middle" letter-spacing="2">MINIATUR CANDI MUARA TAKUS</text>
</svg>
